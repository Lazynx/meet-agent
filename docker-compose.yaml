services:
  agent:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - /app/.venv
    env_file:
      - .env
    command: ["uv", "run", "uvicorn", "src.app:create_app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
